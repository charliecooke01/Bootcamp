<!DOCTYPE html>

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-primary">
        <div class="container">
            <!-- Logo -->
                <a href="index.html"><img class="logo mx-4" src="Assets/Pizza_Logo_Black.png" alt="logo"></a>
                <!-- Dropdown toggle -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!-- Menu list -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav text-success mx-auto align-items-center">
                        <li class="nav-item">
                            <a class="nav-link text-primary" href="pizza.html">Pizza</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-primary" href="pasta.html">Pasta</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-primary" href="sides.html">Sides</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-primary" href="contact.html">Contact</a>
                        </li>
                        <input type="button" class="btn btn-primary" value="Order Now">
                    </ul>
                </div>
        </div>
    </nav>

    <!-- Main Content Section --> 
    <main class="container-fluid text-center bg-info">

     <!--Contact form-->    
    <form class="row justify-content-evenly">
        <h2 class="p-4">Please get in touch</h2>    
        <div class="col-xl-7">
            <label for="name" class="form-label">Name</label>
            <input type="name" class="form-control" placeholder="John Smith" id="name">
        </div>
        <div class="col-xl-7">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="John@smith.com" id="name">
        </div>
        <div class="col-xl-7">
            <label for="phone" class="form-label">Phone</label>
            <input type="phone" class="form-control" placeholder="07123 456789" id="phone">
        </div>
        <div class="col-xl-7">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" placeholder="Your message here"></textarea>
        </div>
        <div class="col-xl-7">
            <label for="spam" class="form-label">Sign up to hear our latest deals</label>
            <input type="checkbox" name="spam" id="spam">
        </div>
    </form>
    <!--Submit Button--> 
    <button type="submit" class="btn btn-primary m-4">Submit</button>


    </main>

    <!-- Footer -->
    <footer class="row d-flex justify-content-center bg-primary text-center py-3">
        <!-- Menu -->
        <div class="col-md-4">
            <ul class="footer-menu list-unstyled class">

            </ul>
        </div>
        <!-- Logo -->
        <div class="col-md-4">
            <a href="index.html"><img class="logo" src="Assets/Pizza_Logo_Black.png" alt="logo"></a>
        </div>
        <!-- Socials -->
        <div class="col-md-4">
            <a href="https://www.facebook.com" target="_blank"><img class="icon" src="https://img.icons8.com/ios-filled/50/161616/facebook--v1.png" alt="facebook"></a>
                <a href="https://www.instagram.com" target="_blank"><img class="icon" src="https://img.icons8.com/ios-filled/50/161616/instagram-new--v1.png" alt="instagram"></a>
                <a href="https://www.youtube.com" target="_blank"><img class="icon" src="https://img.icons8.com/ios-filled/50/youtube-squared.png" alt="youtube-squared" alt="youtube"></a>
        </div>
    </footer>
